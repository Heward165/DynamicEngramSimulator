name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DynamicEngramSimulator.slnx
      - run: dotnet format DynamicEngramSimulator.slnx --no-restore --verify-no-changes
      - run: dotnet build DynamicEngramSimulator.slnx -c Release --no-restore
      - run: dotnet test tests/DynamicEngramSimulator.Tests -c Release --no-build
      - run: dotnet run --project tests/DynamicEngramSimulator.Conformance -c Release --no-build
      - run: dotnet run --project examples/DynamicEngramSimulator.Example -c Release --no-build
      - run: dotnet run --project examples/DynamicEngramSimulator.Experiments -c Release --no-build -- examples/DynamicEngramSimulator.Experiments/plans artifacts/experiments
      - if: runner.os == 'Linux'
        run: dotnet run --project benchmarks/DynamicEngramSimulator.Benchmarks -c Release --no-build
      - if: runner.os == 'Linux'
        run: dotnet pack src/DynamicEngramSimulator/DynamicEngramSimulator.csproj -c Release --no-build -o artifacts/packages
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-packages
          path: artifacts/packages/*.*nupkg

